<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="Imagens/calculadora.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">

    <title>Calculadora</title>

</head>
<body>

    <h1>Calculadora</h1>

        <br><br>

        <div id="alert" class="alert-error" style="display: none;">
            <p id="alert-text"></p>
        </div>

        <main>
            <section>
                <div class="inputs">
                    <label>
                        <input type="number" id="n1" placeholder="Digite um numero...">
                    </label>
                <br><br>
                    <label>
                        <input type="number" id="n2" placeholder="Digite um numero...">
                    </label>
                </div>
            </section>
        <br><br>
            <section id="selecao">
                <select id="operacao">
                    <option value="" disabled selected hidden>Options...</option>
                    <option value="somar">Somar</option>
                    <option value="diminuir">Diminuir</option>
                    <option value="multiplicar">Multiplicar</option>
                    <option value="dividir">Dividir</option>
                    <option value="porcentagem">Porcentagem</option>
                </select>
            </section>
        <br><br>
            <div class="resposta">
                    <button type="button" onclick="calculo()">Calcular</button>
                <div class="result">
                    <output id="output"></output>
                </div>
            </div>
        </main>

    <script src="script.js"></script>

</body>
</html>
