<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="ícones/task.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">

    <title>To-do-list</title>
</head>
<body>
    <h1>To do List</h1>

    <div id="alert" class="alert-error" style="display: none;">
        <p id="alert-text"></p>
    </div>

    <main>
        <section class="first-section">
            <p>Limite máximo 3 (Apenas para exemplo)</p>

            <label class="first-label">
                <input type="text" id="name-adicionar" placeholder="Your name...">
            </label>

            <label class="second-label">
                <input type="text" id="texttarefas" placeholder="Your task...">
            </label>

            <div class="btns">
                <button class="btn add" onclick="adicionar()">Add task</button>
                <button class="btn edit" onclick="editar()">Edit task</button>
            </div>
        </section>

        <div class="second-section">
            <div id="output"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
